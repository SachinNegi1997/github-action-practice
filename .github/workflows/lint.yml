#whenever someone changes the python code the lint will check syntax, format, indentation (linting) is correct or not
name: Auto Linter 
on: 
 push:
   paths: 
     - "**/*.py" #check .py file all location subfolder , root  
jobs:
  code:
   runs-on: ubuntu-latest
   steps:
#this step automatically clone the code of the current branch into runner
     - name: check code
       uses: actions/checkout@v4
#this step will install python
     - name: install python
       uses: actions/python@v5
       with:
         python-version: '3.14'
 #this step will install linter
     - name: Install linter
       run: pip install ruff
 #this step run the linter 
     - name: run linter
       run: ruff check .
       
       
       
