#workflows
#workflows should have name 
name: Hello
#on tells when worksflows run
on:  
 workflow_dispatch:
    
#jobs tells what workflow should do ,there can be one or more jobs hence we write
#should be inside worksflows
jobs:
  #say-hello is first job 
   say-hello:
    # create an Ephemerls container with ubuntu running
     runs-on: ubuntu-latest
     steps:
       - name: say hello to everyone
         run: echo "hello newone"
   





















  
